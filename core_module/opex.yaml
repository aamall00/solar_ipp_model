# OPEX Block — Operating and maintenance costs
#
# Three cost components, all masked to operational periods:
#
#   base_opex  — annual O&M = capacity_mw × opex_per_mw_pa, escalated at
#                opex_escalation rate p.a.  Quarterly = annual / 4.
#
#   insurance  — annual premium = total_project_capex × insurance_percent_of_capex.
#                Fixed in nominal terms (percentage of fixed hard-capex asset base).
#                Reads total_project_capex from construction_block (hard capex only).
#                Quarterly = annual / 4.
#
#   land_lease — fixed annual land lease payment (INR Lakhs p.a.).
#                Quarterly = annual / 4.  Set to 0 for owned land.
#
#   total_opex — sum of the three components above; consumed downstream
#                by tax_block and cashflow_block.
#
# escalate(base, rate) = base × (1 + rate) ^ (period_index / periods_per_year)
# For a quarterly model (ppy=4) this gives correct annual compounding.
#
# Assumptions consumed:
#   capacity_mw                — Installed capacity in MW, e.g. 100.0
#   opex_per_mw_pa             — Base-year O&M in INR Lakhs/MW/year, e.g. 8.0
#   opex_escalation            — Annual O&M escalation rate, e.g. 0.03 (3% p.a.)
#   insurance_percent_of_capex — Annual insurance as fraction of capex, e.g. 0.005
#   land_lease_lakhs_pa        — Annual land lease in INR Lakhs, e.g. 0.0

block_id: opex_block
category: opex
block_type: standard
description: "Quarterly O&M costs: base O&M escalated annually, plus insurance and land lease"

inputs:
  - name: total_project_capex
    source: construction_block.total_project_capex
  - name: capacity_mw
    source: assumption.capacity_mw
  - name: opex_per_mw_pa
    source: assumption.opex_per_mw_pa
  - name: opex_escalation
    source: assumption.opex_escalation
  - name: insurance_percent_of_capex
    source: assumption.insurance_percent_of_capex
  - name: land_lease_lakhs_pa
    source: assumption.land_lease_lakhs_pa
  - name: is_operational
    source: phase.is_operational

outputs:
  - name: base_opex
    unit: INR_Lakhs
  - name: insurance
    unit: INR_Lakhs
  - name: land_lease
    unit: INR_Lakhs
  - name: total_opex
    unit: INR_Lakhs

body:
  # Base O&M: annual cost escalated annually, paid quarterly
  - target: opex_annual_base
    expr: "capacity_mw * opex_per_mw_pa"
  - target: base_opex
    expr: "opex_annual_base / 4.0 * escalate(1.0, opex_escalation) * is_operational"

  # Insurance: annual premium = hard capex × rate; fixed in nominal terms
  - target: insurance
    expr: "total_project_capex * insurance_percent_of_capex / 4.0 * is_operational"

  # Land lease: fixed annual payment, paid quarterly
  - target: land_lease
    expr: "scalar_to_series(land_lease_lakhs_pa / 4.0) * is_operational"

  # Total opex = base O&M + insurance + land lease
  - target: total_opex
    expr: "base_opex + insurance + land_lease"

wiring:
  output_reports:
    income_statement:
      - opex_block.base_opex
      - opex_block.insurance
      - opex_block.land_lease
      - opex_block.total_opex
