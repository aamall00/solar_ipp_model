# Depreciation Block — Asset Ledger (SLM / WDV)
#
# Ledger structure (per period):
#   asset_addition[t]  = depreciable_base at first operational period, else 0
#   opening[t]         = lag(closing, 1)[t] + asset_addition[t]
#   depreciation[t]    = SLM or WDV charge (see below)
#   closing[t]         = opening[t] - depreciation[t]
#
# SLM (straight-line method):
#   charge = min(opening, depreciable_base × depreciation_rate / 4)
#   Capped at the opening book value so cumulative depreciation never exceeds asset base.
#   At 5% p.a. the asset is fully written off in 20 years (80 quarters); charge = 0 after.
#
# WDV (written-down value / declining balance):
#   charge = opening[t] × wdv_rate / 4                  (true declining balance on opening)
#
# Method selection: use_wdv flag (0.0 = SLM, 1.0 = WDV).
#
# Depreciable asset base = 95% of total hard capex (land excluded at 5%).
# IDC is not depreciable under Indian tax law.
#
# Assumptions consumed:
#   depreciation_rate   — Annual SLM rate as decimal, e.g. 0.05 (5% p.a.)
#   depreciation_method — Enum: 'slm' or 'wdv' (informational; use_wdv drives logic)
#   wdv_rate            — Annual WDV rate as decimal, e.g. 0.40 (40% p.a.)
#   use_wdv             — Derived flag: 0.0 = SLM, 1.0 = WDV

block_id: depreciation_block
category: depreciation
block_type: standard
description: "Asset ledger depreciation on 95% of capex; SLM or WDV selected via use_wdv flag"

inputs:
  - name: total_project_capex
    source: construction_block.total_project_capex
  - name: depreciation_rate
    source: assumption.depreciation_rate
  - name: depreciation_method
    source: assumption.depreciation_method
  - name: wdv_rate
    source: assumption.wdv_rate
  - name: use_wdv
    source: assumption.use_wdv
  - name: is_operational
    source: phase.is_operational

outputs:
  - name: depreciable_asset_base
    unit: INR_Lakhs
  - name: asset_addition
    unit: INR_Lakhs
  - name: opening
    unit: INR_Lakhs
  - name: slm_depreciation
    unit: INR_Lakhs
  - name: wdv_depreciation
    unit: INR_Lakhs
  - name: depreciation
    unit: INR_Lakhs
  - name: closing
    unit: INR_Lakhs

body:
  # Depreciable base = 95% of hard capex (land at 5% excluded)
  - target: depreciable_asset_base
    expr: "total_project_capex * 0.95"

  # Asset placed in service at COD: addition fires only at the first operational period
  # (is_operational - lag(is_operational, 1)) = 1 at COD, 0 in all other periods
  - target: asset_addition
    expr: "depreciable_asset_base * (is_operational - lag(is_operational, 1))"

  # Opening balance: prior period closing plus any capitalised addition at COD
  - target: opening
    expr: "lag(closing, 1) + asset_addition"

  # SLM: flat quarterly charge, capped at remaining book value so the asset
  # is never depreciated below zero (fully written off after 1/rate years)
  - target: slm_depreciation
    expr: "min_series(opening, depreciable_asset_base * depreciation_rate / 4.0) * is_operational"

  # WDV: quarterly charge on opening balance (true declining balance)
  - target: wdv_depreciation
    expr: "opening * wdv_rate / 4.0 * is_operational"

  # Select method: use_wdv=0.0 → SLM, use_wdv=1.0 → WDV
  - target: depreciation
    expr: "slm_depreciation * (1.0 - use_wdv) + wdv_depreciation * use_wdv"

  # Closing balance: floored at zero (should be exactly 0 after full write-off)
  - target: closing
    expr: "max_series(opening - depreciation, scalar_to_series(0.0)) * is_operational"

wiring:
  output_reports:
    income_statement:
      - depreciation_block.depreciation
