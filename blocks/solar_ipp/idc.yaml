# IDC Block — Interest During Construction
#
# IDC is always capitalised into the debt base.  The circular dependency
# (drawdown includes IDC; IDC depends on cumulative drawdown) is resolved
# generically by the array_fixed_point solver declared in solve_loops.
# This block's body IS the executable formula — evaluated each iteration.
#
# Formula (average-balance convention):
#   idc[t] = (opening_debt[t] + closing_debt[t]) / 2 × r_q × is_construction[t]
#   opening_debt[t] = lag(cumulative_drawdown, 1)[t]   [zero at t=0]
#   closing_debt[t] = cumulative_drawdown[t]
#
# Key implementation decisions
# ------------------------------
# 1. RATE  — simple division: interest_rate / 4.0 (quarterly model).
#    Project finance term-sheets quote annual nominal (simple) rates for IDC.
#
# 2. AVERAGE BALANCE — (opening + closing) / 2 per period.  Period 0 IDC is
#    half the closing-balance value, as only half a period of interest accrues
#    on the first draw.  Matches standard project finance term-sheet treatment.
#
# Assumptions consumed:
#   interest_rate   — Annual nominal interest rate, e.g. 0.0975

block_id: idc_block
category: idc
block_type: standard
description: "Interest During Construction — capitalised into debt base, average-balance convention"

inputs:
  - name: cumulative_drawdown
    source: debt_service_block.cumulative_drawdown
  - name: interest_rate
    source: assumption.interest_rate
  - name: is_construction
    source: phase.is_construction

outputs:
  - name: idc_per_period
    unit: INR_Lakhs
  - name: cumulative_idc
    unit: INR_Lakhs
  - name: idc_total
    unit: INR_Lakhs

body:
  # Simple quarterly rate: interest_rate / periods_per_year (= / 4 for quarterly model)
  - target: r_simple
    expr: "scalar_to_series(interest_rate / 4.0)"

  # IDC[t] = average of opening and closing balance × r_simple × is_construction[t]
  # lag(cumulative_drawdown, 1) = opening balance (zero at t=0)
  # cumulative_drawdown         = closing balance
  # Average-balance convention matches standard project finance term-sheet treatment.
  - target: idc_per_period
    expr: "(lag(cumulative_drawdown, 1) + cumulative_drawdown) / 2.0 * r_simple * is_construction"

  # Running total IDC (informational; used in returns block for equity cost)
  - target: cumulative_idc
    expr: "cumsum(idc_per_period)"

  # Scalar total IDC broadcast to full series — read by debt_sizing_block
  # each iteration to include capitalised IDC in total project cost.
  - target: idc_total
    expr: "scalar_to_series(max(cumulative_idc))"
