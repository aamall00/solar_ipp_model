# Returns Block — Equity and project cashflows for IRR/NPV computation
#
# Equity Cashflow:
#   Construction periods: equity_invested = −(capex_drawdown − debt_drawdown + idc_per_period)
#   Operational periods:  equity_distributions from waterfall residual
#   equity_cashflow = equity_invested + equity_distribution
#
# Project Cashflow (ungeared, for project IRR):
#   Construction: −total capex drawdown
#   Operations:   CFADS (pre-debt-service)
#   project_cashflow = (−capex_drawdown × is_construction) + (cfads × is_operational)
#
# The executor's KPI layer uses these exact naming conventions:
#   returns_block.equity_cashflow  → equity IRR, payback
#   returns_block.project_cashflow → project IRR, NPV

block_id: returns_block
category: returns
block_type: standard
description: "Equity and project-level cashflows for IRR and NPV computation"

inputs:
  - name: capex_drawdown
    source: construction_block.capex_drawdown
  - name: debt_drawdown
    source: debt_drawdown_block.drawdown
  - name: idc_per_period
    source: idc_block.idc_per_period
  - name: idc_capitalised
    source: assumption.idc_capitalised
  - name: equity_distribution
    source: waterfall_block.equity_distribution
  - name: cfads
    source: cashflow_block.cfads
  - name: is_construction
    source: phase.is_construction
  - name: is_operational
    source: phase.is_operational

outputs:
  - name: equity_invested
    unit: INR_Lakhs
  - name: equity_cashflow
    unit: INR_Lakhs
  - name: project_cashflow
    unit: INR_Lakhs

body:
  # Equity invested during construction: capex not covered by debt, plus IDC.
  # When idc_capitalised=1, IDC is funded by the enlarged debt principal — equity
  # does not pay it separately, so the idc_per_period term is zeroed out.
  # (negative sign: cash outflow from equity perspective)
  - target: equity_invested
    expr: "(capex_drawdown - debt_drawdown + idc_per_period * (1.0 - idc_capitalised)) * is_construction * -1.0"

  # Total equity cashflow: outflow during construction + distributions during ops
  - target: equity_cashflow
    expr: "equity_invested + equity_distribution"

  # Project cashflow (ungeared): capex outflow + CFADS inflows
  - target: project_cashflow
    expr: "capex_drawdown * is_construction * -1.0 + cfads * is_operational"
