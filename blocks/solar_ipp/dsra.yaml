# DSRA Block — Debt Service Reserve Account requirement and ledger
#
# Section 1 — Requirement
#   dsra_required[t] = total_debt_service[t] × (dsra_months / 3.0) × is_debt_outstanding[t]
#
#   Uses the current period's debt service so that the reserve is funded from the
#   first operational period (Q1OPS).  dsra_months / 3.0 converts months to quarters
#   (3 months per quarter).  With equal-principal repayment DS declines over time, so
#   the target will reduce after each payment and small releases will flow back to equity.
#
# Section 2 — Ledger
#   Tracks the DSRA balance period by period.  The waterfall always funds the full
#   top-up, so closing_balance == dsra_required at all times (no shortfall).
#
#   opening_balance[t] = lag(dsra_required, 1)[t] × is_operational[t]   (= 0 at Q1OPS)
#   top_up[t]          = max(0, dsra_required[t] − opening_balance[t])
#   release[t]         = max(0, opening_balance[t] − dsra_required[t])
#   closing_balance[t] = dsra_required[t]   (always funded to target)
#
#   At debt maturity dsra_required falls to 0 and the full balance is released.
#
# Assumptions consumed:
#   dsra_months  — Reserve coverage in months, e.g. 6 (= 2 quarters of debt service)

block_id: dsra_block
category: dsra
block_type: standard
description: "DSRA requirement and balance ledger: required reserve, top-up, release, and closing balance"

inputs:
  - name: total_debt_service
    source: debt_service_block.total_debt_service
  - name: dsra_months
    source: assumption.dsra_months
  - name: is_debt_outstanding
    source: phase.is_debt_outstanding
  - name: is_operational
    source: phase.is_operational

outputs:
  # Section 1 — Requirement
  - name: dsra_required
    unit: INR_Lakhs
  # Section 2 — Ledger
  - name: opening_balance
    unit: INR_Lakhs
  - name: top_up
    unit: INR_Lakhs
  - name: release
    unit: INR_Lakhs
  - name: closing_balance
    unit: INR_Lakhs

body:
  # --- Section 1: Requirement ---

  # Reserve target: current-period DS scaled to coverage window.
  # Using current (not lagged) DS ensures the DSRA is funded at Q1OPS.
  - target: dsra_required
    expr: "total_debt_service * (dsra_months / 3.0) * is_debt_outstanding"

  # --- Section 2: Ledger ---

  # Opening balance = prior period's closing balance (zero before operations)
  - target: opening_balance
    expr: "lag(dsra_required, 1) * is_operational"

  # Top-up required when reserve target increases
  - target: top_up
    expr: "max_series(dsra_required - opening_balance, scalar_to_series(0.0))"

  # Release when reserve target decreases (full release at debt maturity)
  - target: release
    expr: "max_series(opening_balance - dsra_required, scalar_to_series(0.0))"

  # Closing balance: always funded to target by waterfall convention
  - target: closing_balance
    expr: "dsra_required"
