# Debt Sizing Block — Senior term loan quantum
#
# Sizes the total senior debt as a fixed percentage of project capex.
# IDC is treated as an equity cost and is NOT added to the debt base here,
# keeping the debt-sizing loop free of circularity.
#
# debt_amount   = capex_per_mw × capacity_mw × debt_pct
# equity_amount = capex_per_mw × capacity_mw × (1 − debt_pct)
#
# The scalar outputs are broadcast to (n_periods,) arrays by the evaluator.
# Downstream blocks (debt_drawdown, KPI layer) take .flat[0] when a scalar is needed.
#
# Assumptions consumed:
#   capex_per_mw    — Specific capex in INR Lakhs/MW, e.g. 450.0
#   capacity_mw     — Installed capacity in MW, e.g. 100.0
#   debt_pct        — Senior debt fraction of project cost, e.g. 0.70
#   idc_supplement  — IDC capitalised into debt base (0.0 when not capitalising IDC)
#
# When idc_capitalised=0 (default): idc_supplement=0.0 → same result as before
# When idc_capitalised=1: BlueprintAgent adds a goal_seek loop that finds the
#   self-consistent idc_supplement where total_debt includes IDC in the debt base.

block_id: debt_sizing_block
category: debt_sizing
block_type: standard
description: "Senior term loan sizing as a fraction of total project cost (capex + optional IDC)"

inputs:
  - name: capex_per_mw
    source: assumption.capex_per_mw
  - name: capacity_mw
    source: assumption.capacity_mw
  - name: debt_pct
    source: assumption.debt_pct
  - name: idc_supplement
    source: assumption.idc_supplement

outputs:
  - name: total_project_cost
    unit: INR_Lakhs
  - name: debt_amount
    unit: INR_Lakhs
  - name: equity_amount
    unit: INR_Lakhs

body:
  # Total project cost includes capex + capitalised IDC (idc_supplement=0 when not capitalising)
  - target: total_project_cost
    expr: "scalar_to_series(capex_per_mw * capacity_mw + idc_supplement)"

  - target: debt_amount
    expr: "scalar_to_series((capex_per_mw * capacity_mw + idc_supplement) * debt_pct)"

  - target: equity_amount
    expr: "scalar_to_series((capex_per_mw * capacity_mw + idc_supplement) * (1.0 - debt_pct))"
