# Cashflow Block — Standard 3-section Cash Flow Statement
#
# FCFE = CFO + CFI + CFF  where CFF contains debt flows only.
# Equity distributions and equity infusions are covenant / waterfall mechanics;
# they are excluded from this statement to keep the three sections clean.
#
# ── SECTION 1: Cash Flow from Operations (CFO) ──────────────────────────────
#   CFO = EBITDA − Tax − capex_during_ops
#   Subtotal: cfads  (Cash Flow Available for Debt Service)
#
#   CFADS is computed before debt service so the sculpting solver can size the
#   repayment schedule.  Tax is initially computed with interest = 0, so CFADS
#   is slightly overstated before sculpting — standard bankability practice.
#
#   capex_during_ops: quarterly maintenance capex during operations.
#     = total_project_capex × maintenance_capex_pct / 4.
#     Default maintenance_capex_pct = 0.0 so legacy runs are unaffected.
#
# ── SECTION 2: Cash Flow from Investing (CFI) ────────────────────────────────
#   CFI = −capex_drawdown  (construction hard-capex outflow only)
#   Maintenance capex is already deducted inside CFO (reduces cfads).
#
#   project_cashflow (FCFF = CFO + CFI, ungeared):
#     project_cashflow = cfads × is_operational − capex_drawdown × is_construction
#   Pure project return independent of financing structure.
#   Used by the KPI layer for project IRR and NPV.
#
# ── SECTION 3: Cash Flow from Financing (CFF — debt only) ────────────────────
#   Inflows:  debt_drawdown during construction  (lender disburses)
#   Outflows: total_debt_service during operations  (principal + interest repaid)
#
#   net_debt_cashflow (CFF subtotal):
#     = debt_drawdown × is_construction − total_debt_service × is_operational
#
#   equity_invested: equity's share of construction capex.
#     = −(capex_drawdown − debt_drawdown) × is_construction
#     Debt drawdown includes capitalised IDC; equity pays only the residual.
#
#   free_cashflow: post-debt-service operating cashflow.
#     = cfads − total_debt_service
#
#   equity_cashflow (FCFE = CFO + CFI + CFF):
#     = project_cashflow + net_debt_cashflow
#     = equity_invested + free_cashflow × is_operational
#   Used by the KPI layer for equity IRR and payback period.
#
# Naming conventions used by the executor (unchanged):
#   cashflow_block.cfads            → sculpting solver, DSCR computation, KPI CFADS
#   cashflow_block.equity_cashflow  → equity IRR, payback
#   cashflow_block.project_cashflow → project IRR, NPV

block_id: cashflow_block
category: cashflow
block_type: standard
description: "CFO/CFI/CFF(debt-only) cashflow statement; CFADS for sculpting solver; FCFF and FCFE for IRR/NPV"

inputs:
  # ── CFO inputs ──────────────────────────────────────────────────────────────
  - name: ebitda
    source: income_statement_block.ebitda
  - name: tax
    source: income_statement_block.tax
  - name: total_project_capex
    source: construction_block.total_project_capex
  - name: maintenance_capex_pct
    source: assumption.maintenance_capex_pct
  - name: is_operational
    source: phase.is_operational

  # ── CFI inputs ──────────────────────────────────────────────────────────────
  - name: capex_drawdown
    source: construction_block.capex_drawdown
  - name: is_construction
    source: phase.is_construction

  # ── CFF inputs (debt only) ───────────────────────────────────────────────────
  - name: total_debt_service
    source: debt_service_block.total_debt_service
  - name: debt_drawdown
    source: debt_service_block.drawdown

outputs:
  # CFO
  - name: ebitda
    unit: INR_Lakhs
  - name: capex_during_ops
    unit: INR_Lakhs
  - name: cfads
    unit: INR_Lakhs
  # CFI
  - name: project_cashflow
    unit: INR_Lakhs
  # CFF
  - name: net_debt_cashflow
    unit: INR_Lakhs
  - name: equity_invested
    unit: INR_Lakhs
  - name: free_cashflow
    unit: INR_Lakhs
  - name: equity_cashflow
    unit: INR_Lakhs

body:
  # ── SECTION 1: Cash Flow from Operations (CFO) ──────────────────────────────

  # EBITDA passed through from income_statement_block (single source of truth)
  - target: ebitda
    expr: "ebitda"

  # Maintenance capex during operations: periodic replacement provision
  # (e.g. inverters, modules). Zero by default; grows with maintenance_capex_pct.
  - target: capex_during_ops
    expr: "total_project_capex * maintenance_capex_pct / 4.0 * is_operational"

  # CFADS (CFO subtotal): post-tax, post-maintenance-capex, pre-debt-service.
  # Used by the sculpting solver to size the debt repayment schedule.
  - target: cfads
    expr: "ebitda - tax - capex_during_ops"

  # ── SECTION 2: Cash Flow from Investing (CFI) ────────────────────────────────

  # Project cashflow (FCFF = CFO + CFI, ungeared):
  #   Construction: total hard-capex outflow (negative)
  #   Operations:   CFADS (pre-debt-service free cashflow, positive)
  - target: project_cashflow
    expr: "capex_drawdown * is_construction * -1.0 + cfads * is_operational"

  # ── SECTION 3: Cash Flow from Financing (CFF — debt only) ────────────────────

  # Net debt cashflow (CFF subtotal):
  #   Construction: debt disbursed by lender (positive inflow)
  #   Operations:   principal + interest repaid to lender (negative outflow)
  - target: net_debt_cashflow
    expr: "debt_drawdown * is_construction - total_debt_service * is_operational"

  # Equity invested during construction: hard capex not covered by debt drawdown.
  # Debt drawdown includes capitalised IDC; equity covers only the residual fraction.
  # (negative sign: cash outflow from equity perspective)
  - target: equity_invested
    expr: "(capex_drawdown - debt_drawdown) * is_construction * -1.0"

  # Free cashflow (post-debt-service): residual after all lender obligations.
  - target: free_cashflow
    expr: "cfads - total_debt_service"

  # Equity cashflow (FCFE = CFO + CFI + CFF = FCFF + net_debt_cashflow):
  #   = project_cashflow + net_debt_cashflow
  #   = equity_invested + free_cashflow × is_operational
  #   Construction: equity cash outflow for capex not covered by debt
  #   Operations:   post-debt-service free cashflow (pre-waterfall distribution)
  - target: equity_cashflow
    expr: "equity_invested + free_cashflow * is_operational"
