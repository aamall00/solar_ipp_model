# ============================================================================
# Solar IPP Base Model — Karnataka 100 MW Benchmark
# ============================================================================
#
# Full ModelDefinition YAML for a utility-scale solar IPP in Karnataka, India.
# Load via:  from dsl.parser import DSLParser; md, v = DSLParser().load_file(path)
#
# Project parameters (base case)
# --------------------------------
#   Capacity       : 100 MW AC
#   CUF            : 22 % (Karnataka P90 ≈ 19–20 %, P50 ≈ 21–23 %)
#   Capex          : ₹450 Lakh/MW  →  ₹45 000 Lakh total
#   Tariff         : ₹2.65/kWh (fixed, 25-yr PPA)
#   Senior debt    : 70 % at 9.75 % p.a., 18-yr tenor, quarterly repayment
#   DSCR target    : 1.20 × (sculpted profile)
#   Operations     : 25 years post-COD
#
# Time axis (quarterly)
# ----------------------
#   Periods 0–3   : Construction (4 quarters)
#   Periods 4–103 : Operations (100 quarters = 25 years)
#   COD            : period 4  (= construction_periods)
#   Debt maturity  : period 75 (= COD + 18 yr × 4 qtr/yr − 1 = 4 + 71)
#   Total periods  : 104
#
# Solve loop
# -----------
# The debt service schedule is DSCR-sculpted (PV-scaling algorithm).
# The sculpting_solver fires after debt_service_block initialises to zero,
# re-evaluates all downstream blocks to compute CFADS, then sizes DS so that
# DSCR ≈ dscr_target in every repayment period.
#
# One-pass tax approximation:
#   Tax is first computed with interest_payment = 0.  The sculpting loop uses
#   this CFADS to shape DS.  After sculpting, downstream blocks re-execute
#   with actual interest_payment, giving correct final tax/CFADS values.
#   The resulting actual DSCR is within 1–2 % of target — acceptable for
#   bankability screening.

# ============================================================================
# 1. Project Skeleton
# ============================================================================

project_skeleton:
  model_id: solar_ipp_karnataka_100mw
  project_type: solar_ipp
  currency: INR
  currency_unit: Lakhs
  periods_per_year: 4
  construction_periods: 4
  operations_periods: 100
  milestones:
    financial_close: 0
    cod: 4
    debt_maturity: 75
  # phases: auto-derived by DSLParser (_derive_phases); omit from source YAML

# ============================================================================
# 2. Assumption Schema
# ============================================================================

assumption_schema:
  assumptions:

    # --- Generation ---
    - name: capacity_mw
      type: scalar
      unit: MW
      value: 100.0

    - name: cuf
      type: scalar
      unit: ratio
      value: 0.22
      constraints:
        min: 0.15
        max: 0.30

    - name: degradation_rate
      type: scalar
      unit: per_year
      value: 0.005
      sensitivity:
        vary: true
        range_pct: 0.50
        distribution: triangular

    - name: auxiliary_consumption
      type: scalar
      unit: ratio
      value: 0.005

    # --- Revenue ---
    - name: tariff
      type: scalar
      unit: INR_per_kWh
      value: 2.65
      constraints:
        min: 0.0
      sensitivity:
        vary: true
        range_pct: 0.10
        distribution: triangular

    - name: tariff_escalation
      type: scalar
      unit: per_year
      value: 0.0

    - name: ppa_tenor_years
      type: scalar
      unit: years
      value: 25.0
      constraints:
        min: 10.0
        max: 35.0

    # --- Construction / Capex ---
    - name: capex_per_mw
      type: scalar
      unit: INR_Lakhs_per_MW
      value: 450.0
      sensitivity:
        vary: true
        range_pct: 0.10
        distribution: triangular

    - name: capex_schedule
      # time_series type: auto-padded to n_periods; ops-period values are
      # zeroed by the construction phase mask in the block expression.
      type: time_series
      unit: fraction
      value: [0.25, 0.25, 0.25, 0.25]

    # --- O&M ---
    - name: opex_per_mw_pa
      type: scalar
      unit: INR_Lakhs_per_MW_per_year
      value: 8.0
      sensitivity:
        vary: true
        range_pct: 0.20
        distribution: triangular

    - name: opex_escalation
      type: scalar
      unit: per_year
      value: 0.03

    - name: insurance_percent_of_capex
      # Annual insurance premium as a fraction of total project capex.
      # Typical range for Indian solar IPP: 0.3%–0.8% p.a.
      type: scalar
      unit: ratio
      value: 0.005
      constraints:
        min: 0.0
        max: 0.02

    - name: land_lease_lakhs_pa
      # Annual land lease payment (INR Lakhs/year). Typical Karnataka solar:
      # ~500 acres × INR 8–10k/acre/year ≈ 40–50 Lakhs p.a. Set to 0 for owned land.
      type: scalar
      unit: INR_Lakhs_per_year
      value: 50.0
      constraints:
        min: 0.0

    - name: maintenance_capex_pct
      # Annual capex during operations as a fraction of total project capex.
      # Covers periodic component replacements (inverters, modules) and major overhauls.
      # Deducted from CFADS: CFADS = EBITDA − Tax − capex_during_ops.
      type: scalar
      unit: ratio
      value: 0.0
      constraints:
        min: 0.0
        max: 0.10

    # --- Debt ---
    - name: debt_pct
      type: scalar
      unit: ratio
      value: 0.70
      constraints:
        min: 0.40
        max: 0.80

    - name: interest_rate
      type: scalar
      unit: per_year
      value: 0.0975
      constraints:
        min: 0.05
        max: 0.20
      sensitivity:
        vary: true
        range_pct: 0.15
        distribution: triangular

    - name: moratorium_periods
      type: scalar
      unit: quarters
      value: 0.0

    - name: debt_repayment_periods
      type: scalar
      unit: quarters
      value: 60.0
      constraints:
        min: 4.0
        max: 100.0

    - name: dscr_target
      type: scalar
      unit: ratio
      value: 1.20
      constraints:
        min: 1.0
        max: 2.0

    # debt_sizing_mode — controls how total debt quantum is determined:
    #   0.0  →  cost_based : total_debt = capex × debt_pct (fixed)
    #            Repayment  : equal principal instalments over tenor
    #            DSCR target NOT enforced; warnings raised on breach
    #   1.0  →  cfads_based: total_debt = PV(CFADS / dscr_target)
    #            Repayment  : sculpted proportional to CFADS (DSCR = target by design)
    #            Iterates CFADS until self-consistent with interest tax shield
    - name: debt_sizing_mode
      type: scalar
      unit: flag
      value: 0.0

    - name: dsra_months
      type: scalar
      unit: months
      value: 6.0

    - name: cash_sweep_rate
      # Fraction of post-DSRA excess cash swept to accelerate debt repayment.
      # 0.0 = no sweep (all residual to equity). 1.0 = full sweep until debt retired.
      type: scalar
      unit: ratio
      value: 0.0
      constraints:
        min: 0.0
        max: 1.0

    # --- Tax & Depreciation ---
    - name: tax_rate
      type: scalar
      unit: ratio
      value: 0.25
      constraints:
        min: 0.0
        max: 0.40

    - name: depreciation_rate
      type: scalar
      unit: per_year
      value: 0.05

    - name: depreciation_method
      # Depreciation method for P&L and tax computation.
      # 'slm' = straight-line (default). 'wdv' = written-down value / declining balance.
      # Note: WDV calculation requires a ledger-type executor code path; the current
      # depreciation_block computes SLM only. This assumption is consumed by the ingestion
      # and blueprint agents to select the correct block variant in future work.
      type: enum
      unit: string
      value: "slm"

    - name: wdv_rate
      # Annual WDV depreciation rate (decimal). Only applicable when depreciation_method='wdv'.
      # Indian Income Tax Act (Schedule II) specifies 40% p.a. for solar photovoltaic systems.
      type: scalar
      unit: per_year
      value: 0.40
      constraints:
        min: 0.05
        max: 0.80

    - name: use_wdv
      # Numeric flag derived from depreciation_method: 0.0 = SLM, 1.0 = WDV.
      # Set automatically by the ingestion agent; do not edit directly.
      type: scalar
      unit: flag
      value: 0.0
      constraints:
        min: 0.0
        max: 1.0

    # --- Returns ---
    - name: equity_irr_target
      type: scalar
      unit: per_year
      value: 0.14

# ============================================================================
# 3. Calculation Blocks
# ============================================================================
# Block definitions are loaded from the block library (blocks/solar_ipp/*.yaml).
# DSLParser resolves import_from at load time — no duplication needed here.

calculation_blocks:
  import_from: solar_ipp

  # ------------------------------------------------------------------
  # Solve Loops
  # ------------------------------------------------------------------
  solve_loops:
    # IDC capitalisation loop — resolves the circular dependency between debt drawdown and IDC:
    #   debt_service_block draws debt_pct × (hard_capex[t] + idc[t]) each period
    #   idc_block computes idc_per_period from cumulative_drawdown (average-balance)
    #   idc_block.idc_per_period feeds back to debt_service_block → circular
    #
    # The generic array_fixed_point solver re-evaluates owned_blocks in declared
    # order each iteration. Convergence: max(|idc_per_period_new - old|) < tolerance.
    # Contraction ratio ≈ debt_pct × r_q / 2 ≈ 0.0085 → ~3–5 iterations.
    # debt_service_block runs in full each iteration (drawdown + sizing + service).
    - loop_id: idc_capitalisation
      type: array_fixed_point
      free_variable: idc_block.idc_per_period
      target_expression: "idc_block.idc_per_period"
      target_value: 0.0
      owned_blocks:
        - construction_block   # reads idc_per_period (varying) + hard_capex (static)
        - debt_service_block   # reads construction_block.total_capex; computes drawdown + service
        - idc_block            # reads debt_service_block.cumulative_drawdown

# ============================================================================
# 4. Model Wiring
# ============================================================================

model_wiring:

  # Key cross-block connections (documentation and validation).
  # All sources are also declared as BlockInput.source within each block.
  connections:
    # Generation → Revenue
    - from: generation_block.net_generation_kwh
      to: revenue_block.net_generation_kwh

    # Construction capex_drawdown → Cashflow (CFI section)
    - from: construction_block.capex_drawdown
      to: cashflow_block.capex_drawdown

    # Construction total_project_capex → Depreciation, Opex, Cashflow (R1: single source)
    - from: construction_block.total_project_capex
      to: depreciation_block.total_project_capex
    - from: construction_block.total_project_capex
      to: opex_block.total_project_capex
    - from: construction_block.total_project_capex
      to: cashflow_block.total_project_capex

    # IDC per period → Construction block (circular leg — resolved by idc_capitalisation loop)
    - from: idc_block.idc_per_period
      to: construction_block.idc_per_period

    # Construction total_capex → Debt service (drawdown section, circular leg)
    - from: construction_block.total_capex
      to: debt_service_block.total_capex

    # Debt service cumulative_drawdown → IDC (circular leg)
    - from: debt_service_block.cumulative_drawdown
      to: idc_block.cumulative_drawdown

    # EBITDA from tax_block → Cashflow block (R2: single source)
    - from: income_statement_block.ebitda
      to: cashflow_block.ebitda

    # Revenue → Tax
    - from: revenue_block.revenue
      to: income_statement_block.revenue

    # Total opex (base O&M + insurance + land lease) → Tax
    - from: opex_block.total_opex
      to: income_statement_block.opex

    # Depreciation → Tax
    - from: depreciation_block.depreciation
      to: income_statement_block.depreciation

    # Debt service interest → Tax (tax shield; zero before sculpting)
    - from: debt_service_block.interest_payment
      to: income_statement_block.interest_payment

    # Tax → Cashflow
    - from: income_statement_block.tax
      to: cashflow_block.tax

    # Debt service → Cashflow
    - from: debt_service_block.total_debt_service
      to: cashflow_block.total_debt_service

    # Debt service → DSRA requirement
    - from: debt_service_block.total_debt_service
      to: dsra_block.total_debt_service

    # Waterfall inputs
    - from: revenue_block.revenue
      to: waterfall_block.revenue
    - from: opex_block.total_opex
      to: waterfall_block.total_opex
    - from: income_statement_block.tax
      to: waterfall_block.tax
    - from: debt_service_block.total_debt_service
      to: waterfall_block.total_ds
    - from: dsra_block.dsra_required
      to: waterfall_block.dsra_req

    # Cashflow CFF inputs (debt drawdown, cash sweep, DSRA movements for FCFE)
    - from: debt_service_block.drawdown
      to: cashflow_block.debt_drawdown
    - from: waterfall_block.cash_sweep
      to: cashflow_block.cash_sweep
    - from: waterfall_block.dsra_funding
      to: cashflow_block.dsra_funding
    - from: dsra_block.release
      to: cashflow_block.dsra_release

  output_reports:
    income_statement:
      - revenue_block.revenue
      - opex_block.base_opex
      - opex_block.insurance
      - opex_block.land_lease
      - opex_block.total_opex
      - depreciation_block.depreciation
      - income_statement_block.ebitda
      - income_statement_block.ebit
      - income_statement_block.pbt
      - income_statement_block.tax

    construction_capex:
      - construction_block.capex_drawdown
      - idc_block.idc_per_period
      - construction_block.total_capex
      - construction_block.cumulative_capex
      - debt_service_block.drawdown
      - debt_service_block.cumulative_drawdown
      - debt_service_block.debt_amount
      - debt_service_block.total_project_cost
      - debt_service_block.equity_amount

    cash_flow_statement:
      - cashflow_block.ebitda
      - cashflow_block.capex_during_ops
      - cashflow_block.cfads
      - cashflow_block.project_cashflow
      - cashflow_block.net_debt_cashflow
      - cashflow_block.cash_sweep
      - cashflow_block.equity_invested
      - cashflow_block.free_cashflow
      - cashflow_block.net_dsra_cashflow
      - cashflow_block.equity_cashflow
      - waterfall_block.equity_distribution

    debt_schedule:
      - debt_service_block.outstanding_debt_balance
      - debt_service_block.principal_repayment
      - debt_service_block.interest_payment
      - debt_service_block.total_debt_service
      - dsra_block.dsra_required
      - dsra_block.opening_balance
      - dsra_block.top_up
      - dsra_block.release
      - dsra_block.closing_balance

    returns_summary:
      - cashflow_block.equity_invested
      - cashflow_block.net_debt_cashflow
      - cashflow_block.net_dsra_cashflow
      - cashflow_block.equity_cashflow
      - cashflow_block.project_cashflow
